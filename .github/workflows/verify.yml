name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            app/requirements.lock

      - name: Install locked dependencies
        run: >-
          python -m pip install
          -r app/requirements.lock
          -r requirements-dev.txt

      - name: Static and unit checks
        run: |
          ruff check app bench seed tools tests
          ruff format --check app bench seed tools tests
          bash -n prepare.sh run_experiment.sh
          python -m compileall -q app bench seed tools tests
          python -m pytest -q
          python tools/generate_flags.py --count 50 --check
          docker compose config --quiet

      - name: Prepare pinned providers
        run: ./prepare.sh

      - name: Diagnose provider startup failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail=200 flipt flagd

      - name: Build application image
        run: docker compose build app

      - name: Run reduced provider matrix
        env:
          RUN_ID: ci
          FLAG_COUNTS: "3"
          RATES: "5"
          REPS: "1"
          DURATION: "1"
          WARMUP: "0.2"
          SETTLE_SECONDS: "0"
          RUN_MICRO: "1"
          MICRO_FLAG_COUNTS: "1,3"
          MICRO_ROUNDS: "1"
        run: ./run_experiment.sh

      - name: Stop test services
        if: always()
        run: docker compose down --volumes
